name: Bug report / 问题报告
description: Report a reproducible problem with synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "English / 简体中文 / 繁體中文 are welcome. Remove private notes and tokens. For security issues, use SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Plugin version or commit, Omarchy/Hyprland versions, display resolution and scale, affected devices.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Use a sample note instead of personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Optional; redact private content first.
